# Project name: `docker compose -p beaty` in scripts/redeploy.sh
# (top-level `name:` needs Compose V2; legacy docker-compose rejects it)

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: beaty-backend:latest
  env_file:
    - .env.prod
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beaty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: beaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beaty -d beaty"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEED_IF_EMPTY: "true"
      RUN_SCHEDULER_IN_API: "false"
    ports:
      - "${WEB_PORT:-4040}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.run"]

  platform-bot:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.platform_bot.run_polling"]

volumes:
  pgdata:
  redisdata:
