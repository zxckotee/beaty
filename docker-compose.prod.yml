# Project name: `docker compose -p beaty` in scripts/redeploy.sh
# (top-level `name:` needs Compose V2; legacy docker-compose rejects it)

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: beaty-backend:latest
  env_file:
    - .env.prod
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beaty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: beaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beaty -d beaty"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SCHEDULER_IN_API: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.run"]

  platform-bot:
    <<: *backend
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.platform_bot.run_polling"]

  web:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    image: beaty-web:latest
    ports:
      - "${WEB_PORT:-4040}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required for tls profile}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
