      <h1>Правила публикации отзывов</h1>
      <p>Отзыв может оставить клиент после завершённого визита, один отзыв на запись. Публикуется текст и оценка; имя маскируется.</p>
      <p>Салон может публично ответить. Скрытие негативных отзывов платформой не допускается; модерация — только при нарушении закона или оскорблениях.</p>
