<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('beaty.theme') || 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>Документация · Beaty</title>
    <link rel="icon" type="image/png" href="/static/img/beaty-logo.png?v=4" />
    <link rel="stylesheet" href="/static/css/platform.css?v=5" />
  </head>
  <body class="platform-page">
    <div class="platform-glow platform-glow--a" aria-hidden="true"></div>
    <div class="platform-glow platform-glow--b" aria-hidden="true"></div>
    <header class="platform-nav">
      <a class="platform-brand" href="/">
        <img src="/static/img/beaty-logo.png?v=4" width="40" height="40" alt="" />
        <span>Beaty</span>
      </a>
      <nav class="platform-nav-links">
        <a href="/">Главная</a>
        <a href="/docs" aria-current="page">Документация</a>
      </nav>
      <div class="platform-nav-cta">
        <a class="btn btn-primary" href="https://t.me/beaty_welcome_agent" rel="noopener" target="_blank">Подключить салон</a>
      </div>
    </header>
    <main class="platform-docs-main">
      <h1 class="platform-grad">Документация Beaty</h1>
      <p class="platform-lead">Справка для владельцев салонов: подключение бота, кабинет, клиенты и законность обработки данных.</p>
      <div id="docs-sections" class="platform-docs-sections"></div>
      <section class="platform-onboard-guide" style="margin-top: 2rem">
        <h2>Правовые документы</h2>
        <ul id="docs-legal" class="platform-docs-legal-list"></ul>
      </section>
    </main>
    <footer class="platform-footer">
      <img src="/static/img/beaty-logo.png?v=4" width="48" height="48" alt="" />
      <p>© Beaty — онлайн-запись для beauty-бизнеса</p>
    </footer>
    <script type="module">
      const root = document.getElementById('docs-sections');
      const legalRoot = document.getElementById('docs-legal');
      try {
        const data = await fetch('/api/docs/platform').then((r) => r.json());
        for (const s of data.sections || []) {
          const det = document.createElement('details');
          det.className = 'platform-details';
          det.open = s.id === 'platform-onboard';
          det.innerHTML = `<summary>${s.title}</summary><div class="platform-details-body"><p>${s.body}</p></div>`;
          root.append(det);
        }
        for (const link of data.legal_links || []) {
          const li = document.createElement('li');
          li.innerHTML = `<a href="${link.href}">${link.label}</a>`;
          legalRoot.append(li);
        }
      } catch (e) {
        root.innerHTML = '<p class="muted">Не удалось загрузить разделы. Обновите страницу.</p>';
      }
    </script>
  </body>
</html>
