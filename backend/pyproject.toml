[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beaty-backend"
version = "0.1.0"
description = "Beaty booking platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiogram>=3.15.0",
    "aiohttp-socks>=0.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "cryptography>=44.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "boto3>=1.35.0",
    "PyJWT>=2.10.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
    "sentry-sdk[fastapi]>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"app/domain/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app.domain", "app.core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
